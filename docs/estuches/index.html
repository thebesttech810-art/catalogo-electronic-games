<!doctype html>
<html lang="es-EC">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo de estuches Samsung</title>
<meta name="description" content="Mira todos los estuches para celulares Samsung y busca el de tu modelo: A05, A54, S24 y más. Catálogo para ver y consultar.">
<meta name="theme-color" content="#0D0E12">
<meta property="og:type" content="website">
<meta property="og:locale" content="es_EC">
<meta property="og:title" content="Catálogo de estuches Samsung">
<meta property="og:description" content="Busca el estuche de tu modelo Samsung y mira las fotos.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Concepto: sala de exhibición. La foto manda: escenario oscuro, el fondo toma el color de cada estuche y todo lo demás se aparta. Un solo color de acento (coral). */
:root{
  --bg:#0D0E12; --panel:#15171D; --panel2:#1C1F27; --fg:#F4F1EE; --muted:#A4A7B3; --line:#2A2D38;
  --acento:#FF7A66; --acento-ink:#1B0A07;
  --display:"Sora","Segoe UI",system-ui,sans-serif;
  --cuerpo:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--cuerpo);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:max(24px,env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin-inline:auto}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--display);line-height:1.1;letter-spacing:-.02em;text-wrap:balance}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acento);outline-offset:3px;border-radius:10px}

/* Encabezado */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 0 8px}
.logo{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:700;font-size:1.1rem;letter-spacing:-.02em;text-decoration:none;color:var(--fg)}
.logo i{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--fg);color:var(--bg)}
.logo svg{width:22px;height:22px}
.top .cuenta{color:var(--muted);font-size:.92rem}
.btn-wa{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;background:#25D366;color:#06260F;font-weight:700;font-size:.92rem;text-decoration:none}

/* Buscador */
.cab{padding:34px 0 22px;text-align:center}
.cab h1{font-size:clamp(2rem,5.2vw,3.6rem);font-weight:700}
.cab p{margin:14px auto 0;max-width:34em;color:var(--muted);font-size:1.08rem}
.buscar{position:relative;max-width:640px;margin:28px auto 0}
.buscar svg{position:absolute;left:20px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--muted);pointer-events:none}
.buscar input{width:100%;padding:18px 54px 18px 56px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);color:var(--fg);font:inherit;font-size:1.1rem;font-weight:500;box-shadow:0 20px 40px -24px rgba(0,0,0,.8)}
.buscar input::placeholder{color:#7E8190}
.buscar input::-webkit-search-cancel-button,.buscar input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.buscar input:focus{outline:none;border-color:var(--acento);box-shadow:0 0 0 4px rgba(255,122,102,.2)}
.buscar button{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;background:var(--panel2);color:var(--fg);cursor:pointer;font-size:1.2rem;line-height:1}
.series{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:18px}
.series button,.sugeridos button{padding:9px 18px;border-radius:999px;border:1.5px solid var(--line);background:transparent;cursor:pointer;font-weight:600;font-size:.92rem;color:var(--muted)}
.series button:hover,.sugeridos button:hover{border-color:var(--muted);color:var(--fg)}
.series button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.estado{margin-top:18px;min-height:1.6em;color:var(--muted);font-size:.98rem}
.estado b{color:var(--fg)}
.sugeridos{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}

/* Carrusel */
.escenario{position:relative;border-radius:30px;overflow:hidden;background:#07080B;border:1px solid var(--line);isolation:isolate;touch-action:pan-y}
.fondo{position:absolute;inset:-40px;z-index:-1;background-size:cover;background-position:center;filter:blur(46px) saturate(1.25) brightness(.55);transform:scale(1.15);transition:background-image .5s ease}
.vista{display:grid;grid-template-columns:72px minmax(0,1fr) 72px;align-items:center;min-height:min(74vh,720px);padding:26px 10px}
.foto-caja{display:flex;align-items:center;justify-content:center;height:min(66vh,640px);min-width:0}
.foto-caja img{max-width:100%;max-height:min(66vh,640px);width:auto;height:auto;object-fit:contain;border-radius:16px;box-shadow:0 30px 60px -20px rgba(0,0,0,.7);cursor:zoom-in;animation:entra .45s ease both;user-select:none;-webkit-user-drag:none}
@keyframes entra{from{opacity:.0;transform:scale(.985)}to{opacity:1;transform:none}}
.flecha{width:52px;height:52px;border-radius:50%;border:1.5px solid rgba(255,255,255,.28);background:rgba(13,14,18,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;cursor:pointer;display:grid;place-items:center;justify-self:center;transition:background-color .15s ease,transform .15s ease}
.flecha:hover{background:var(--acento);color:var(--acento-ink);border-color:var(--acento);transform:scale(1.06)}
.flecha svg{width:24px;height:24px}
.flecha[disabled]{opacity:.35;pointer-events:none}
.pie-esc{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px;padding:6px 26px 24px}
.titulo-esc{min-width:0}
.titulo-esc h2{font-size:clamp(1.5rem,3.4vw,2.3rem);font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.12);font-size:.84rem;font-weight:600;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.chip.cod{background:transparent;border:1px dashed rgba(255,255,255,.4);font-weight:500}
.controles{display:flex;align-items:center;gap:12px;color:#DCDDE3;font-size:.92rem;font-variant-numeric:tabular-nums}
.btn-sec{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:1.5px solid rgba(255,255,255,.3);background:rgba(13,14,18,.4);color:#fff;cursor:pointer;font-weight:600;font-size:.88rem}
.btn-sec:hover{border-color:#fff}
.btn-sec svg{width:16px;height:16px}
.tira{display:flex;gap:10px;overflow-x:auto;padding:4px 26px 22px;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:#3A3D49 transparent}
.tira button{flex:none;width:78px;height:98px;padding:0;border-radius:14px;border:2px solid transparent;background:#101218;overflow:hidden;cursor:pointer;opacity:.62;transition:opacity .15s ease,border-color .15s ease,transform .15s ease;scroll-snap-align:center}
.tira button:hover{opacity:1}
.tira button[aria-current="true"]{opacity:1;border-color:var(--acento);transform:translateY(-3px)}
.tira img{width:100%;height:100%;object-fit:cover;display:block}
.vacio{display:grid;place-items:center;text-align:center;min-height:300px;padding:40px 20px;color:var(--muted)}
.vacio h3{color:var(--fg);font-size:1.4rem;margin-bottom:8px}
@media (max-width:760px){
  .vista{grid-template-columns:minmax(0,1fr);padding:18px 14px 8px;min-height:0;position:relative}
  .foto-caja{height:min(58vh,520px)}
  .foto-caja img{max-height:min(58vh,520px)}
  .flecha{position:absolute;top:calc(50% - 40px);width:44px;height:44px;z-index:3}
  #ant{left:10px} #sig{right:10px}
  .pie-esc{padding:6px 18px 18px}
  .tira{padding:4px 18px 18px}
  .tira button{width:64px;height:82px}
}

/* Índice de modelos */
section{padding:72px 0 0}
.enc{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:26px}
.enc h2{font-size:clamp(1.6rem,3.4vw,2.3rem)}
.enc p{color:var(--muted)}
.modelos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.mod{display:flex;flex-direction:column;text-align:left;padding:0;border-radius:20px;border:1px solid var(--line);background:var(--panel);overflow:hidden;cursor:pointer;transition:transform .18s ease,border-color .18s ease}
.mod:hover{transform:translateY(-4px);border-color:var(--acento)}
.mod .im{aspect-ratio:4/5;background:#0A0B0E;overflow:hidden}
.mod img{width:100%;height:100%;object-fit:cover;display:block}
.mod .tx{padding:13px 16px 15px}
.mod b{display:block;font-family:var(--display);font-weight:600;font-size:1.02rem;line-height:1.2}
.mod span{color:var(--muted);font-size:.86rem}
@media (max-width:520px){ .modelos{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px} .mod .tx{padding:11px 12px 13px} }

/* Pantalla completa con pase automático */
.pantalla{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:max(14px,env(safe-area-inset-top,0px)) 14px max(14px,env(safe-area-inset-bottom,0px));overflow:hidden;touch-action:pan-y}
.p-fondo{position:absolute;inset:-60px;z-index:0;background-size:cover;background-position:center;filter:blur(60px) saturate(1.3) brightness(.5);transform:scale(1.2)}
.pantalla>*:not(.p-fondo){position:relative;z-index:1}
#pFoto{height:min(calc(100vh - 160px),calc(92vw * 5 / 3));height:min(calc(100dvh - 160px),calc(92vw * 5 / 3));aspect-ratio:3/5;width:auto;object-fit:cover;border-radius:22px;box-shadow:0 40px 80px -20px rgba(0,0,0,.8);animation:entra .6s ease both;cursor:pointer;user-select:none;-webkit-user-drag:none}
.p-pie{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;width:min(100%,880px)}
.p-info{display:flex;flex-direction:column;min-width:0}
.p-info b{font-family:var(--display);font-size:clamp(1.3rem,3.2vw,2rem);line-height:1.1}
.p-info span{color:#C9CAD2;font-size:.95rem;font-variant-numeric:tabular-nums}
.p-ctrl{display:flex;gap:8px;transition:opacity .4s ease}
.p-barra{position:absolute!important;top:0;left:0;right:0;height:5px;background:rgba(255,255,255,.15);z-index:2}
.p-barra i{display:block;height:100%;width:100%;background:var(--acento);transform-origin:left;animation:progreso 4.5s linear both}
@keyframes progreso{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.pantalla.pausa .p-barra i{animation-play-state:paused}
.pantalla.quieto{cursor:none}
.pantalla.quieto .p-ctrl{opacity:0;pointer-events:none}

footer{margin-top:80px;padding:26px 0 8px;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
/* Fotos verticales 3:5 */
.foto-caja img{width:min(100%,calc(min(66vh,640px) * .6));height:auto;aspect-ratio:3/5;max-height:none;object-fit:cover}
.tira button{width:58px;height:96px}
.mod .im{aspect-ratio:3/5}
@media (max-width:760px){ .foto-caja img{width:min(100%,calc(min(58vh,520px) * .6))} .tira button{width:52px;height:86px} }
@media (prefers-reduced-motion:reduce){ .p-barra i{animation:none} #pFoto{animation:none} }
@media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto} .foto-caja img{animation:none} .fondo{transition:none} .mod,.flecha,.tira button{transition:none} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">

  <main>

    <div class="escenario" id="escenario" role="region" aria-roledescription="carrusel" aria-label="Fotos de estuches">

          </div>
        </div>
        <div class="tira" id="tira" aria-label="Miniaturas"></div>
      </div>
      <div class="vacio" id="vacio" hidden>
        <div><h3 id="vacioTit">No encontramos ese modelo</h3><p id="vacioTxt"></p><div class="sugeridos" id="sugeridos"></div></div>
      </div>
    </div>

    <section id="modelos">
      <div class="enc"><div><h2>Todos los modelos</h2><p>Toca uno para ver sus estuches.</p></div></div>
      <div class="modelos" id="rejilla"></div>
    </section>
  </main>

  <footer><span id="nota"></span><span>Catálogo informativo · Las fotos son referenciales</span></footer>
</div>

<div class="pantalla" id="pantalla" role="dialog" aria-modal="true" aria-label="Presentación a pantalla completa" hidden>
  <div class="p-fondo" id="pFondo" aria-hidden="true"></div>
  <div class="p-barra" aria-hidden="true"><i id="pProgreso"></i></div>
  <img id="pFoto" alt="">
  <div class="p-pie">
    <div class="p-info"><b id="pNombre"></b><span id="pCont"></span></div>
    <div class="p-ctrl">
      <button class="btn-sec" id="pAnt" type="button" aria-label="Foto anterior">&#8249;</button>
      <button class="btn-sec" id="pPausa" type="button">Pausar</button>
      <button class="btn-sec" id="pSig" type="button" aria-label="Foto siguiente">&#8250;</button>
      <button class="btn-sec" id="pCerrar" type="button">Salir</button>
    </div>
  </div>
</div>

    $("pCont").textContent = (pos + 1) + " de " + lista.length;
    var b = $("pProgreso"); b.style.animation = "none"; void b.offsetWidth; b.style.animation = "";
    precargar(pos + 1);
  }
  function programarP(){
    clearTimeout(tP);
    if (pausaP || $("pantalla").hidden || lista.length < 2) return;
    tP = setTimeout(function(){ ir(1); }, INTERVALO);
  }
  function pintarPausaP(){ $("pPausa").textContent = pausaP ? "Seguir" : "Pausar"; $("pantalla").classList.toggle("pausa", pausaP); }
  function pausaPantalla(){ pausaP = !pausaP; pintarPausaP(); pintarPantalla(); programarP(); }
  function mostrarCtrl(){ var p = $("pantalla"); p.classList.remove("quieto"); clearTimeout(ocultar); ocultar = setTimeout(function(){ p.classList.add("quieto"); }, 3200); }
  function abrirPantalla(){
    if (!lista.length) return;
    pausaP = false; pintarPausaP();
    $("pantalla").hidden = false; document.body.style.overflow = "hidden"; detener();
    pintarPantalla(); programarP(); mostrarCtrl();
    try { var el = document.documentElement, rf = el.requestFullscreen || el.webkitRequestFullscreen; if (rf){ var r = rf.call(el); if (r && r.catch) r.catch(function(){}); } } catch(e){}
    try { if (navigator.wakeLock) navigator.wakeLock.request("screen").then(function(w){ bloqueo = w; }).catch(function(){}); } catch(e){}
    $("pCerrar").focus();
  }
  function cerrarPantalla(){
    if ($("pantalla").hidden) return;
    clearTimeout(tP); clearTimeout(ocultar); $("pantalla").hidden = true; document.body.style.overflow = "";
    try { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); else if (document.webkitFullscreenElement && document.webkitExitFullscreen) document.webkitExitFullscreen(); } catch(e){}
    try { if (bloqueo){ bloqueo.release(); bloqueo = null; } } catch(e){}
    pintarEscena(false); programar(); $("grande").focus();
  }
  function alCambiarPantallaCompleta(){ if (!document.fullscreenElement && !document.webkitFullscreenElement) cerrarPantalla(); }
  document.addEventListener("fullscreenchange", alCambiarPantallaCompleta);
  document.addEventListener("webkitfullscreenchange", alCambiarPantallaCompleta);
  document.addEventListener("visibilitychange", function(){ if (!document.hidden && bloqueo === null && !$("pantalla").hidden && navigator.wakeLock) navigator.wakeLock.request("screen").then(function(w){ bloqueo = w; }).catch(function(){}); });
  $("foto").addEventListener("click", abrirPantalla);
  $("grande").addEventListener("click", abrirPantalla);
  $("pCerrar").addEventListener("click", cerrarPantalla);
  $("pAnt").addEventListener("click", function(){ ir(-1); });
  $("pSig").addEventListener("click", function(){ ir(1); });
  $("pPausa").addEventListener("click", pausaPantalla);
  var pant = $("pantalla");
  pant.addEventListener("pointermove", mostrarCtrl);
  pant.addEventListener("pointerdown", function(e){ mostrarCtrl(); if (e.target.closest("button")) return; px0 = e.clientX; pmovio = false; });
  pant.addEventListener("pointerup", function(e){
    if (px0 === null) return; var dx = e.clientX - px0; px0 = null;
    if (Math.abs(dx) > 50){ ir(dx < 0 ? 1 : -1); return; }
    if (e.target === $("pFoto")) pausaPantalla();
  });

  // ---- Inicio ----
  $("rejilla").innerHTML = MODELOS.map(function(m){
    var f = FOTOS[m.f[0]];
    return '<button class="mod" type="button" data-m="' + m.i + '"><span class="im"><img src="' + f.mini + '" alt="" loading="lazy" decoding="async"></span><span class="tx"><b>Samsung ' + esc(m.n) + "</b><span>" + m.f.length + (m.f.length === 1 ? " foto" : " fotos") + "</span></span></button>";
  }).join("");
  $("cuenta").textContent = FOTOS.length + " fotos · " + MODELOS.length + " modelos";
  $("nota").textContent = CONFIG.nota;
  if (CONFIG.whatsapp){ var w = $("waTop"); w.hidden = false; w.href = "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent("Hola, busco un estuche para mi Samsung."); }
  // Si la dirección trae ?q=a05 se busca directo
  try { var p = new URLSearchParams(location.search).get("q"); if (p) $("q").value = p; } catch(e){}
  buscar();
  try { if (new URLSearchParams(location.search).has("pantalla")) abrirPantalla(); } catch(e){}
})();
</script>
</body>
</html>
