<!doctype html>
<html lang="es-EC">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sin conexión · Electronic Games</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0A0B">
<style>
/* La muestra el service worker (sw.js) cuando no hay internet y la página no estaba guardada. */
:root{color-scheme:dark}
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#0A0A0B;color:#F7F4EF;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px}
img{display:block;height:180px;width:auto;margin:0 auto 18px;filter:drop-shadow(0 14px 22px rgba(0,0,0,.55))}
h1{margin:0 0 8px;font-size:clamp(1.6rem,6vw,2.4rem);font-style:italic;font-weight:900;text-transform:uppercase}
p{margin:0 auto 24px;color:#A39C94;max-width:38ch}
button{min-height:52px;padding:14px 24px;border-radius:14px;border:0;background:#FF7A00;color:#140900;font-weight:800;font-size:1rem;cursor:pointer}
button:hover{background:#FF9A2E}
</style>
</head>
<body>
<main>
  <img src="mascota/poses/triste.webp" alt="" width="371" height="560">
  <h1>Sin internet</h1>
  <p>No pudimos abrir la tienda. Revisa tu conexión y vuelve a intentar: el muñequito te espera.</p>
  <button type="button" onclick="location.reload()">Reintentar</button>
</main>
<script>addEventListener("online", function(){ location.reload(); });</script>
</body>
</html>
