name: Actualizar catálogo

on:
  schedule:
    - cron: "*/15 * * * *"   # stock, cada 15 minutos
    - cron: "0 11 * * *"      # selección de productos y precios, 06:00 hora de Ecuador
  workflow_dispatch:
    inputs:
      completo:
        description: "Recalcular también la selección de productos y los precios"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: catalogo
  cancel-in-progress: false

jobs:
  actualizar:
    # Versión fija de Ubuntu: "ubuntu-latest" cambia solo a Ubuntu 26 desde el 19 de octubre de 2026.
    runs-on: ubuntu-24.04
    # Una corrida normal tarda 1 a 4 minutos. Si algo se cuelga, se corta a los 20 en vez de
    # bloquear la fila (el máximo de GitHub son 6 horas y mientras tanto no se actualiza nada).
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    env:
      CONTIFICO_API_KEY: ${{ secrets.CONTIFICO_API_KEY }}
      CONTIFICO_BASE_URL: https://api.contifico.com/sistema/api/v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests python-dotenv

      - name: Selección de productos y precios (una vez al día)
        if: github.event.schedule == '0 11 * * *' || inputs.completo
        run: |
          # Sin salida en el log: el repositorio es público y los datos de ventas son internos.
          python ventas_rotacion.py 30 > /dev/null
          python generar_catalogo.py > /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/products.json docs/meta.json seleccion.json
          git diff --cached --quiet || git commit -m "Actualizar selección y precios del catálogo"
          # Si entró un cambio a main mientras corría, se pone encima en vez de fallar el envío.
          git pull --rebase -q origin main
          git push

      - name: Stock de los productos publicados (cada 15 minutos)
        id: stock
        run: python actualizar_stock.py

      # Si Contífico no respondió (un corte pasajero), esta vez no se publica: la página
      # sigue con lo último y la próxima corrida la actualiza.
      - if: steps.stock.outputs.publicar != 'false'
        uses: actions/configure-pages@v5

      - if: steps.stock.outputs.publicar != 'false'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # A veces GitHub falla al dar el permiso para publicar (un error pasajero de ellos):
      # se espera un poco y se intenta otra vez antes de dar la corrida por fallida.
      - id: deploy
        if: steps.stock.outputs.publicar != 'false'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Esperar antes de reintentar la publicación
        if: steps.deploy.outcome == 'failure'
        run: sleep 45

      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
